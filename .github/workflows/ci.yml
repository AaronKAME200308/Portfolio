
name: Portfolio CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire le projet
        run: npm run build
      
      - name: Version Node.js
        run: node -v

      - name: CI Start
        run: echo "CI Pipeline started successfully"
